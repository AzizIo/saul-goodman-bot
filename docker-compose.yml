services:
  bot:
    build: .
    image: saul-goodman-bot:latest
    container_name: saul-goodman-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/saul.db
      QR_DIR: /app/data/qr
    volumes:
      - saul-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  saul-data: